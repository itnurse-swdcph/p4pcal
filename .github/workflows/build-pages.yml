name: Build and publish P4P app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4p-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        working-directory: app
        run: npm run build
      - name: Publish bundle to GitHub Pages folder
        run: |
          mkdir -p docs
          find docs -mindepth 1 -maxdepth 1 ! -name '.nojekyll' -exec rm -rf {} +
          cp -R app/dist/. docs/
          touch docs/.nojekyll
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Published bundle is already up to date."
          else
            git commit -m "build: publish latest P4P web app"
            git push origin main
          fi
